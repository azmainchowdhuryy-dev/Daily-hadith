name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.json icon.svg icon-192.png icon-512.png www/
          sed -i 's/if("serviceWorker" in navigator){[^}]*}[^}]*}//' www/index.html
          sed -i '/<link rel="manifest"/d' www/index.html

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Daily Hadith" com.azmain.dailyhadith --web-dir www
          npx cap add android

      - name: Generate app icon
        continue-on-error: true
        run: |
          mkdir -p assets
          convert icon-512.png -resize 1024x1024 assets/icon-only.png
          cp assets/icon-only.png assets/icon-foreground.png
          convert -size 1024x1024 xc:'#0f6b4f' assets/icon-background.png
          npm install @capacitor/assets@3
          npx capacitor-assets generate --android

      - name: Sync and build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-hadith-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
