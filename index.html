<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f6b4f"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><title>প্রতিদিনের হাদিস</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1d2a24;--mute:#5d6b63;--line:#d9d2c0;--accent:#0f6b4f;--accent-ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a16;--card:#14241e;--ink:#e9efe9;--mute:#98aaa0;--line:#264036;--accent:#d8b45a;--accent-ink:#1a1405}}
:root[data-theme="dark"]{--bg:#0e1a16;--card:#14241e;--ink:#e9efe9;--mute:#98aaa0;--line:#264036;--accent:#d8b45a;--accent-ink:#1a1405}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.7}
main{max-width:620px;margin:0 auto;padding:20px 18px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:1.15rem;margin:0;font-weight:600}
.date{color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px}
.ar{font-family:Amiri,"Noto Naskh Arabic",serif;direction:rtl;text-align:center;font-size:1.9rem;line-height:2.2;margin:0 0 18px}
.bn{font-size:1.08rem;margin:0 0 16px}
.ref{border-top:1px solid var(--line);padding-top:12px;color:var(--mute);font-size:.9rem}
.badge{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 10px;font-size:.8rem;margin-right:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.nav button{flex:1}
.note{margin-top:22px;font-size:.82rem;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<main>
<header><h1>প্রতিদিনের হাদিস</h1><span class="date" id="date"></span></header>
<article class="card" aria-live="polite">
<p class="ar" id="ar"></p>
<p class="bn" id="bn"></p>
<div class="ref"><span class="badge" id="grade"></span><span id="ref"></span></div>
<div class="row">
<button class="primary" id="fav">☆ সংরক্ষণ</button>
<button id="share">শেয়ার</button>
<button id="copy">কপি</button>
</div>
</article>
<div class="nav"><button id="prev">‹ আগের</button><button id="today">আজকের</button><button id="next">পরের ›</button></div>
<div class="row"><button id="showFav">সংরক্ষিত হাদিস</button></div>
<div id="favList"></div>
<p class="note">বাছাইয়ের নিয়ম: শুধু সহিহ বুখারী ও সহিহ মুসলিম থেকে ছোট ও সুপরিচিত হাদিস (বর্তমানে ৩৫টি)। আরবি অংশে সনদ বাদ দিয়ে শুধু রাসূলুল্লাহ ﷺ-এর বাণী আছে; বাংলা অনুবাদে বর্ণনাকারীর পরিচয় আছে। ডেটার উৎস: hadith-api (fawazahmed0)। শেয়ার করার আগে মূল কিতাবের সাথে মিলিয়ে নেওয়া ভালো।</p>
</main>
<div id="toast"></div>
<script>
const H=[{"ar":"لاَ يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ وَالِدِهِ وَوَلَدِهِ وَالنَّاسِ أَجْمَعِينَ","bn":"আনাস (রাযি.) হতে বর্ণিত। আল্লাহর রাসূল সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেনঃ তোমাদের কেউ প্রকৃত মু’মিন হতে পারবে না, যতক্ষণ না আমি তার নিকট তার পিতা, তার সন্তান ও সব মানুষের অপেক্ষা অধিক প্রিয়পাত্র হই। (মুসলিম ১/১৬ হাঃ ৪৪, আহমাদ ১২৮১৪)","ref":"সহিহ বুখারী ১৫","grade":"সহিহ"},{"ar":"إِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ، وَإِنَّ الْبِرَّ يَهْدِي إِلَى الْجَنَّةِ، وَإِنَّ الرَّجُلَ لَيَصْدُقُ حَتَّى يَكُونَ صِدِّيقًا، وَإِنَّ الْكَذِبَ يَهْدِي إِلَى الْفُجُورِ، وَإِنَّ الْفُجُورَ يَهْدِي إِلَى النَّارِ، وَإِنَّ الرَّجُلَ لَيَكْذِبُ، حَتَّى يُكْتَبَ عِنْدَ اللَّهِ كَذَّابًا","bn":"‘আবদুল্লাহ (রাঃ) হতে বর্ণিত। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ সত্য নেকীর দিকে পরিচালিত করে আর নেকী জান্নাতে পৌঁছায়। আর মানুষ সত্যের উপর কায়িম থেকে অবশেষে সিদ্দীক-এর দরজা লাভ করে। আর মিথ্যা মানুষকে পাপের দিকে নিয়ে যায়, পাপ তাকে জাহান্নামে নিয়ে যায়। আর মানুষ মিথ্যা কথা বলতে বলতে অবশেষে আল্লাহর কাছে মহামিথ্যাচারী প্রতিপন্ন হয়ে যায়।","ref":"সহিহ বুখারী ৬০৯৪","grade":"সহিহ"},{"ar":"يَسِّرُوا وَلاَ تُعَسِّرُوا، وَسَكِّنُوا وَلاَ تُنَفِّرُوا","bn":"আনাস ইবনু মালিক (রাঃ) হতে বর্ণিত। তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ তোমরা নম্র হও এবং কঠোর হয়ো না। শান্তি দান কর, বিদ্বেষ সৃষ্টি করো না।","ref":"সহিহ বুখারী ৬১২৫","grade":"সহিহ"},{"ar":"كُلُّ سُلاَمَى مِنَ النَّاسِ عَلَيْهِ صَدَقَةٌ، كُلَّ يَوْمٍ تَطْلُعُ فِيهِ الشَّمْسُ يَعْدِلُ بَيْنَ النَّاسِ صَدَقَةٌ","bn":"আবূ হুরাইরাহ্ (রাঃ) হতে বর্ণিত। তিনি বলেন, আল্লাহর রাসূল (সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম) বলেছেন, ‘মানুষের প্রতিটি হাতের জোড়ার জন্য তার উপর সদাকাহ রয়েছে। সূর্য উঠে এমন প্রত্যেক দিন মানুষের মধ্যে সুবিচার করাও সদাকাহ।’","ref":"সহিহ বুখারী ২৭০৭","grade":"সহিহ"},{"ar":"آيَةُ الْمُنَافِقِ ثَلاَثٌ إِذَا حَدَّثَ كَذَبَ، وَإِذَا اؤْتُمِنَ خَانَ، وَإِذَا وَعَدَ أَخَلَفَ","bn":"আবূ হুরাইরাহ্ (রাঃ) হতে বর্ণিত। রাসূলুল্লাহ (সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম) বলেছেন, মুনাফিকের আলামত তিনটি- বলতে গেলে মিথ্যা বলে, আমানত রাখলে খিয়ানত করে, আর ওয়াদা করলে তা ভঙ্গ করে।","ref":"সহিহ বুখারী ২৬৮২","grade":"সহিহ"},{"ar":"إِنَّ مِنَ الْبَيَانِ لَسِحْرًا ـ أَوْ ـ إِنَّ بَعْضَ الْبَيَانِ لَسِحْرٌ","bn":"‘আবদুল্লাহ ইবনু ‘উমার (রাঃ) হতে বর্ণিত। তিনি বলেন, একবার পূর্ব অঞ্চল (নজদ এলাকা) থেকে দু’জন লোক এল এবং দু’জনই ভাষণ দিল। লোকজন তাদের ভাষণে বিস্মিত হয়ে গেল। তখন রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেনঃ কোন কোন ভাষণ অবশ্যই যাদুর মত।","ref":"সহিহ বুখারী ৫৭৬৭","grade":"সহিহ"},{"ar":"مَنْ صَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ","bn":"আবূ হুরাইরাহ (রাযি.) হতে বর্ণিত। তিনি বলেন, আল্লাহর রাসূল সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ যে ব্যক্তি ঈমানসহ পুণ্যের আশায় রমাযানের সিয়াম ব্রত পালন করে, তার পূর্বের গুনাহ ক্ষমা করে দেয়া হয়।","ref":"সহিহ বুখারী ৩৮","grade":"সহিহ"},{"ar":"لاَ يَتَمَنَّيَنَّ أَحَدُكُمُ الْمَوْتَ مِنْ ضُرٍّ أَصَابَهُ، فَإِنْ كَانَ لاَ بُدَّ فَاعِلاً فَلْيَقُلِ اللَّهُمَّ أَحْيِنِي مَا كَانَتِ الْحَيَاةُ خَيْرًا لِي، وَتَوَفَّنِي إِذَا كَانَتِ الْوَفَاةُ خَيْرًا لِي","bn":"আনাস ইবনু মালিক (রাঃ) হতে বর্ণিত। তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ তোমাদের কেউ দুঃখ কষ্টে পতিত হবার কারণে যেন মৃত্যু কামনা না করে। যদি কিছু করতেই চায়, তা হলে সে যেন বলেঃ হে আল্লাহ! আমাকে জীবিত রাখ, যতদিন আমার জন্য বেঁচে থাকা কল্যাণকর হয় এবং আমাকে মৃত্যু দাও, যখন আমার জন্য মরে যাওয়া কল্যাণকর হয়।","ref":"সহিহ বুখারী ৫৬৭১","grade":"সহিহ"},{"ar":"مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلاَ يُؤْذِ جَارَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيُكْرِمْ ضَيْفَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ","bn":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত যে, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ যে লোক আল্লাহ্ ও শেষ দিনে ঈমান রাখে, সে যেন তার প্রতিবেশীকে কষ্ট না দেয়। আর যে লোক আল্লাহ ও শেষ দিনে ঈমান রাখে সে যেন মেহমানের সম্মান করে। আর যে ব্যক্তি আল্লাহতে ও শেষ দিনে ঈমান রাখে, সে যেন ভাল কথা বলে, নতুবা চুপ থাকে।","ref":"সহিহ বুখারী ৬১৩৬","grade":"সহিহ"},{"ar":"مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُصِبْ مِنْهُ","bn":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেনঃ আল্লাহ যে ব্যক্তির কল্যাণ কামনা করেন তাকে তিনি দুঃখকষ্টে পতিত করেন।","ref":"সহিহ বুখারী ৫৬৪৫","grade":"সহিহ"},{"ar":"كُلُّ مَعْرُوفٍ صَدَقَةٌ","bn":"জাবির ইবনু ‘আবদুল্লাহ (রাঃ) হতে বর্ণিত। তিনি নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম থেকে বর্ণনা করেছেন। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ সকল সৎ ‘আমল সদাকাহ হিসেবে গণ্য।","ref":"সহিহ বুখারী ৬০২১","grade":"সহিহ"},{"ar":"أَنْتَ مَعَ مَنْ أَحْبَبْتَ","bn":"আনাস ইবনু মালিক (রাঃ) হতে বর্ণিত। এক ব্যক্তি নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম কে জিজ্ঞেস করলঃ হে আল্লাহর রাসূল! ক্বিয়ামাত (কিয়ামত) কবে হবে? তিনি তাকে জিজ্ঞেস করলেনঃ তুমি এর জন্য কী প্রস্তুতি গ্রহণ করেছ? সে বলল­ঃ আমি এর জন্য তো অধিক কিছু সালাত, সওম এবং সদাকাহ আদায় করতে পারিনি। কিন্তু আমি আল্লাহ ও তাঁর রাসূলকে ভালবাসি। তিনি বললেনঃ তুমি যাকে ভালবাস তারই সাথী হবে।","ref":"সহিহ বুখারী ৬১৭১","grade":"সহিহ"},{"ar":"خَيْرُ النَّاسِ قَرْنِي، ثُمَّ الَّذِينَ يَلُونَهُمْ، ثُمَّ الَّذِينَ يَلُونَهُمْ، ثُمَّ يَجِيءُ مِنْ بَعْدِهِمْ قَوْمٌ تَسْبِقُ شَهَادَتُهُمْ أَيْمَانَهُمْ وَأَيْمَانُهُمْ شَهَادَتَهُمْ","bn":"‘আবদুল্লাহ্ ইবনু মাস‘ঊদ (রাঃ) হতে বর্ণিত যে, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ সর্বোত্তম হল আমার যুগের লোকেরা। তারপর উত্তম হল এদের পরবর্তী যুগের লোকেরা, তারপর উত্তম হল তাদের পরবর্তী যুগের লোকেরা, তারপর এমন সব লোকের আবির্ভাব ঘটবে, যাদের সাক্ষ্য হবে কসমের পূর্বে, আর কসম হবে সাক্ষ্যের পূর্বে।","ref":"সহিহ বুখারী ৬৪২৯","grade":"সহিহ"},{"ar":"الْمُسْلِمُ أَخُو الْمُسْلِمِ، لاَ يَظْلِمُهُ وَلاَ يُسْلِمُهُ، وَمَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ، وَمَنْ فَرَّجَ عَنْ مُسْلِمٍ كُرْبَةً فَرَّجَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرُبَاتِ يَوْمِ الْقِيَامَةِ، وَمَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللَّهُ يَوْمَ الْقِيَامَةِ","bn":"‘আবদুল্লাহ ইবনু ‘উমার (রাঃ) হতে বর্ণিত। রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, মুসলিম মুসলিমের ভাই। সে তার উপর জুলুম করবে না এবং তাকে যালিমের হাতে সোপর্দ করবে না। যে কেউ তার ভাইয়ের অভাব পূরণ করবে,আল্লাহ তার অভাব পূরণ করবেন।যে কেউ তার মুসলিম ভাইয়ের বিপদ দুর করবে, আল্লাহ তা‘আলা কিয়ামতের দিন তার বিপদসমূহ দূর করবেন। যে ব্যক্তি কোন মুসলিমের দোষ ঢেকে রাখবে, আল্লাহ কিয়ামতের দিন তার দোষ ঢেকে রাখবেন।","ref":"সহিহ বুখারী ২৪৪২","grade":"সহিহ"},{"ar":"مَنْ لاَ يَرْحَمُ لاَ يُرْحَمُ","bn":"জারীর ইবনু ‘আবদুল্লাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ যে (সৃষ্টির প্রতি) দয়া করে না, (আল্লাহর পক্ষ থেকে) তার প্রতি দয়া করা হয় না।","ref":"সহিহ বুখারী ৬০১৩","grade":"সহিহ"},{"ar":"كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ، سُبْحَانَ اللَّهِ الْعَظِيمِ، سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","bn":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ দু’টি বাক্য এমন যা মুখে উচ্চারণ করা অতি সহজ, পাল্লায় অতি ভারী, আর আল্লাহর নিকট অতি প্রিয়। তা হলোঃ সুবহানাল্লাহিল আযীম, সুবহানাল্লাহি ওয়া বিহামদিহ।","ref":"সহিহ বুখারী ৬৪০৬","grade":"সহিহ"},{"ar":"الْحَيَاءُ مِنَ الإِيمَانِ","bn":"আবূ বাকর ইবনু আবূ শাইবাহ, আমর আন নাকিদ ও যুহায়র ইবনু হারব (রহঃ) ... সলিমের পিতা আবদুল্লাহ (রাযিঃ) থেকে বর্ণনা করেন, এক ব্যক্তি তার ভাইকে লজ্জার ব্যাপারে উপদেশ দিচ্ছিলেন শুনতে পেয়ে রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়া সাল্লাম বললেন, লজ্জা ঈমানের অঙ্গ।","ref":"সহিহ মুসলিম ১৫৪","grade":"সহিহ"},{"ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ","bn":"আনাস ইবনু মালিক (রাঃ) বর্ণনা করেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম যখন পায়খানায় প্রবেশ করতেন, তখন তিনি বলতেনঃ হে আল্লাহ! আমি আপনার কাছে যাবতীয় পুরুষ ও স্ত্রী শয়তানদের থেকে আশ্রয় প্রার্থনা করছি।","ref":"সহিহ বুখারী ৬৩২২","grade":"সহিহ"},{"ar":"لاَ يَدْخُلُ الْجَنَّةَ نَمَّامٌ","bn":"শাইবান ইবনু ফাররূখ ও আবদুল্লাহ ইবনু মুহাম্মাদ ইবনু আসমা আয যুবাঈ (রহঃ) ... আবূ ওয়ায়িল (রহঃ) বলেন যে, হুযাইফাহ (রাযিঃ) এর নিকট খবর পৌছল যে, এক ব্যক্তি চোগলখোর করে বেড়ায়। তিনি বললেন, আমি রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়া সাল্লাম কে বলতে শুনেছি, কোন চোগলখোরই জান্নাতে প্রবেশ করতে পারবে না*।","ref":"সহিহ মুসলিম ২৯০","grade":"সহিহ"},{"ar":"إِذَا دَخَلَ أَحَدُكُمُ الْمَسْجِدَ فَلْيَرْكَعْ رَكْعَتَيْنِ قَبْلَ أَنْ يَجْلِسَ","bn":"আবূ কাতাদাহ্ সালামী (রাযি.) হতে বর্ণিত। আল্লাহর রাসূল সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ তোমাদের কেউ মসজিদে প্রবেশ করলে সে যেন বসার পূর্বে দু’রাক‘আত সালাত আদায় করে নেয়। (১১৬৩; মুসলিম ৬/১০, হাঃ ৭১৪, আহমাদ ১৫৭৮৯)","ref":"সহিহ বুখারী ৪৪৪","grade":"সহিহ"},{"ar":"مَثَلُ الْجَلِيسِ الصَّالِحِ وَالْجَلِيسِ السَّوْءِ كَمَثَلِ صَاحِبِ الْمِسْكِ، وَكِيرِ الْحَدَّادِ، لاَ يَعْدَمُكَ مِنْ صَاحِبِ الْمِسْكِ إِمَّا تَشْتَرِيهِ، أَوْ تَجِدُ رِيحَهُ، وَكِيرُ الْحَدَّادِ يُحْرِقُ بَدَنَكَ أَوْ ثَوْبَكَ أَوْ تَجِدُ مِنْهُ رِيحًا خَبِيثَةً","bn":"আবূ মূসা (রাঃ) হতে বর্ণিত। তিনি বলেন, আল্লাহর রাসূল সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, সৎ সঙ্গী ও অসৎ সঙ্গীর উদাহরণ মিস্ক বিক্রেতা ও কর্মকারের হাপরের ন্যায়। আতর বিক্রেতাদের থেকে শূন্য হাতে ফিরে আসবে না। হয় তুমি আতর খরিদ করবে, না হয় তার সুঘ্রাণ পাবে। আর কর্মকারের হাপর হয় তোমার ঘর অথবা তোমার কাপড় পুড়িয়ে দেবে, না হয় তুমি তার দুর্গন্ধ পাবে।","ref":"সহিহ বুখারী ২১০১","grade":"সহিহ"},{"ar":"يَسِّرُوا وَلاَ تُعَسِّرُوا، وَبَشِّرُوا وَلاَ تُنَفِّرُوا","bn":"আনাস (রাযি.) থেকে বর্ণিত, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ তোমরা সহজ পন্থা অবলম্বন কর, কঠিন পন্থা অবলম্বন করো না, মানুষকে সুসংবাদ দাও, বিরক্তি সৃষ্টি করো না। (৬১২৫; মুসলিম ৩২/৩ হাঃ ১৭৩৪, আহমাদ ১৩১৭৪)","ref":"সহিহ বুখারী ৬৯","grade":"সহিহ"},{"ar":"كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ، أَوْ عَابِرُ سَبِيلٍ","bn":"‘আবদুল্লাহ্ ইবনু ‘উমার (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম একবার আমার দু’ কাঁধ ধরে বললেনঃ তুমি দুনিয়াতে থাক যেন তুমি একজন প্রবাসী অথবা পথচারী। আর ইবনু ‘উমার (রাঃ) বলতেন, তুমি সন্ধ্যায় উপনীত হলে সকালের আর অপেক্ষা করো না এবং সকালে উপনীত হলে সন্ধ্যার আর অপেক্ষা করো না। তোমার সুস্থতার সময় তোমার পীড়িত অবস্থার জন্য প্রস্তুতি লও। আর তোমার জীবিত অবস্থায় তোমার মৃত্যুর জন্য প্রস্তুতি লও।","ref":"সহিহ বুখারী ৬৪১৬","grade":"সহিহ"},{"ar":"الْيَدُ الْعُلْيَا خَيْرٌ مِنَ الْيَدِ السُّفْلَى، وَابْدَأْ بِمَنْ تَعُولُ، وَخَيْرُ الصَّدَقَةِ عَنْ ظَهْرِ غِنًى، وَمَنْ يَسْتَعْفِفْ يُعِفَّهُ اللَّهُ، وَمَنْ يَسْتَغْنِ يُغْنِهِ اللَّهُ","bn":"ওহায়ব (রহ.) বলেন, আবূ হুরাইরাহ্ (রাঃ) সূত্রে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে অনুরূপ বর্ণিত আছে। (১৪২৬, মুসলিম ১২/৩২, হাঃ ১০৩৪, আহমাদ ১৫৩২৬)","ref":"সহিহ বুখারী ১৪২৭","grade":"সহিহ"},{"ar":"مَا أَكَلَ أَحَدٌ طَعَامًا قَطُّ خَيْرًا مِنْ أَنْ يَأْكُلَ مِنْ عَمَلِ يَدِهِ، وَإِنَّ نَبِيَّ اللَّهِ دَاوُدَ ـ عَلَيْهِ السَّلاَمُ ـ كَانَ يَأْكُلُ مِنْ عَمَلِ يَدِهِ","bn":"মিকদাম (রাঃ) সূত্রে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে বর্ণিত। তিনি বলেন, নিজ হাতে উপার্জিত খাদ্যের চেয়ে উত্তম খাদ্য কখনো কেউ খায় না। আল্লাহর নবী দাঊদ (আঃ) নিজ হাতে উপার্জন করে খেতেন।","ref":"সহিহ বুখারী ২০৭২","grade":"সহিহ"},{"ar":"مَنْ قَالَ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ. فِي يَوْمٍ مِائَةَ مَرَّةٍ حُطَّتْ خَطَايَاهُ، وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ","bn":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ যে লোক প্রতিদিন একশ’বার সুবাহানাল্লাহি ওয়া বিহামদিহ বলবে তার গুনাহগুলো ক্ষমা করে দেয়া হবে তা সমুদ্রের ফেনা পরিমাণ হলেও।","ref":"সহিহ বুখারী ৬৪০৫","grade":"সহিহ"},{"ar":"خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ","bn":"‘উসমান (রাঃ) সূত্রে নবী সাল্লাল্লাহু ‘আলাইহি ওয়াসাল্লাম হতে বর্ণিত। তিনি বলেন, তোমাদের মধ্যে ঐ ব্যক্তি সবচেয়ে উত্তম যে কুরআন শিখে এবং অন্যকে শিখায়।","ref":"সহিহ বুখারী ৫০২৭","grade":"সহিহ"},{"ar":"لَوْلاَ أَنْ أَشُقَّ عَلَى أُمَّتِي لأَمَرْتُهُمْ بِالسِّوَاكِ","bn":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত যে, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ আমার উম্মাতের উপর যদি কষ্টকর মনে না করতাম, তাহলে আমি তাদেরকে মিস্ওয়াক করার হুকুম করতাম।","ref":"সহিহ বুখারী ৭২৪০","grade":"সহিহ"},{"ar":"الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ، وَالْمُهَاجِرُ مَنْ هَجَرَ مَا نَهَى اللَّهُ عَنْهُ","bn":"‘আবদুল্লাহ্ ইবনু ‘আমর (রাঃ) বর্ণনা করেছেন। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ মুসলিম (প্রকৃত) সেই, যার যবান ও হাত থেকে মুসলিমগণ নিরাপদ থাকে। আর (প্রকৃত) মুহাজির সেই, আল্লাহ্ যা নিষেধ করেছেন তা যে পরিত্যাগ করে।","ref":"সহিহ বুখারী ৬৪৮৪","grade":"সহিহ"},{"ar":"مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ، وَاللَّهُ الْمُعْطِي وَأَنَا الْقَاسِمُ، وَلاَ تَزَالُ هَذِهِ الأُمَّةُ ظَاهِرِينَ عَلَى مَنْ خَالَفَهُمْ حَتَّى يَأْتِيَ أَمْرُ اللَّهِ وَهُمْ ظَاهِرُونَ","bn":"মু‘আবিয়াহ (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূল সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, ‘আল্লাহ তা‘আলা যার কল্যাণ চান, তাকে দ্বীনের জ্ঞান দান করেন। আল্লাহই দানকারী আর আমি বণ্টনকারী। এ উম্মাত সর্বদা তাদের প্রতিপক্ষের উপর বিজয়ী থাকবে, আল্লাহর আদেশ আসা পর্যন্ত আর তারা বিজয়ী থাকবে।’","ref":"সহিহ বুখারী ৩১১৬","grade":"সহিহ"},{"ar":"بَلِّغُوا عَنِّي وَلَوْ آيَةً، وَحَدِّثُوا عَنْ بَنِي إِسْرَائِيلَ وَلاَ حَرَجَ، وَمَنْ كَذَبَ عَلَىَّ مُتَعَمِّدًا فَلْيَتَبَوَّأْ مَقْعَدَهُ مِنَ النَّارِ","bn":"‘আবদুল্লাহ ইবনু ‘আমর (রাঃ) হতে বর্ণিত। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, আমার কথা পৌঁছিয়ে দাও, তা যদি এক আয়াতও হয়। আর বনী ইসরাঈলের ঘটনাবলী বর্ণনা কর। এতে কোন দোষ নেই। কিন্তু যে কেউ ইচ্ছে করে আমার উপর মিথ্যারোপ করল, সে যেন জাহান্নামকেই তার ঠিকানা নির্দিষ্ট করে নিল।","ref":"সহিহ বুখারী ৩৪৬১","grade":"সহিহ"},{"ar":"مَثَلُ الَّذِي يَذْكُرُ رَبَّهُ وَالَّذِي لاَ يَذْكُرُ مَثَلُ الْحَىِّ وَالْمَيِّتِ","bn":"আবূ মূসা (রাঃ) হতে বর্ণিত। তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ যে তার প্রতিপালকের যিকর করে, আর যে যিকর করে না, তাদের উপমা হলো জীবিত ও মৃত ব্যক্তি।","ref":"সহিহ বুখারী ৬৪০৭","grade":"সহিহ"},{"ar":"مَنْ قَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ","bn":"আবূ হুরাইরাহ (রাযি.) থেকে বর্ণনা করেন, তিনি বলেন যে, আল্লাহর রাসূল সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম ইরশাদ করেনঃ যে ব্যক্তি রমাযানের রাতে ঈমানসহ পুণ্যের আশায় রাত জেগে ইবাদত করে, তার পূর্বের গুনাহ্ ক্ষমা করে দেয়া হয়।","ref":"সহিহ বুখারী ৩৭","grade":"সহিহ"},{"ar":"اتَّقُوا النَّارَ وَلَوْ بِشِقِّ تَمْرَةٍ","bn":"‘আদী ইবনু হাতিম (রাঃ) হতে বর্ণিত। তিনি বলেন, আমি নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -কে বলতে শুনেছি, তোমরা জাহান্নাম হতে আত্মরক্ষা কর এক টুকরা খেজুর সদাকাহ করে হলেও।","ref":"সহিহ বুখারী ১৪১৭","grade":"সহিহ"},{"ar":"الإِيمَانُ بِضْعٌ وَسَبْعُونَ شُعْبَةً وَالْحَيَاءُ شُعْبَةٌ مِنَ الإِيمَانِ","bn":"উবাইদুল্লাহ ইবনু সাঈদ ও আবদ ইবনু হুমায়দ (রহঃ) ... আবূ হুরায়রাহ (রাযিঃ) বর্ণনা করেন যে, নবী সাল্লাল্লাহু আলাইহি ওয়া সাল্লাম বলেছেনঃ ঈমানের শাখা সত্তরটির চেয়েও বেশি, আর লজ্জা শরম ঈমানের একটি শাখা।","ref":"সহিহ মুসলিম ১৫২","grade":"সহিহ"}];
const $=id=>document.getElementById(id);
const bnNum=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
function dayOfYear(d){return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)}
const todayIdx=()=>dayOfYear(new Date())%H.length;
let idx=todayIdx(),favs=[];
try{favs=JSON.parse(localStorage.getItem("favs")||"[]")}catch(e){}
function saveFavs(){try{localStorage.setItem("favs",JSON.stringify(favs))}catch(e){}}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1500)}
function render(){
const h=H[idx];
$("ar").textContent=h.ar;$("bn").textContent=h.bn;$("ref").textContent=h.ref;$("grade").textContent=h.grade;
$("fav").textContent=favs.includes(idx)?"★ সংরক্ষিত":"☆ সংরক্ষণ";
$("date").textContent=new Date().toLocaleDateString("bn-BD",{day:"numeric",month:"long",year:"numeric"});
}
function text(){const h=H[idx];return h.ar+"\n\n"+h.bn+"\n\n("+h.ref+")"}
$("prev").onclick=()=>{idx=(idx-1+H.length)%H.length;render()};
$("next").onclick=()=>{idx=(idx+1)%H.length;render()};
$("today").onclick=()=>{idx=todayIdx();render()};
$("fav").onclick=()=>{favs=favs.includes(idx)?favs.filter(i=>i!==idx):[...favs,idx];saveFavs();render();renderFavs()};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(text());toast("কপি হয়েছে")}catch(e){toast("কপি করা যায়নি")}};
$("share").onclick=async()=>{
if(navigator.share){try{await navigator.share({text:text()})}catch(e){}}
else{window.open("https://wa.me/?text="+encodeURIComponent(text()),"_blank")}
};
let open=false;
function renderFavs(){
const box=$("favList");box.innerHTML="";
if(!open)return;
if(!favs.length){box.innerHTML='<p class="note">এখনো কিছু সংরক্ষণ করোনি। হাদিসের নিচে ‘সংরক্ষণ’ চাপো।</p>';return}
favs.forEach(i=>{
const b=document.createElement("button");b.style.cssText="display:block;width:100%;text-align:left;margin-top:8px";
b.textContent=H[i].bn.slice(0,60)+(H[i].bn.length>60?"…":"")+" ("+H[i].ref+")";
b.onclick=()=>{idx=i;render();window.scrollTo({top:0,behavior:"smooth"})};
box.appendChild(b);
});
}
$("showFav").onclick=()=>{open=!open;renderFavs()};
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
